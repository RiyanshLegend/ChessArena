<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chess Arena | Magnus AI</title>

    <link rel="stylesheet" href="play.css">
</head>

<body>

    <header class="topbar">
        <div class="logo">♟ CHESS ARENA</div>

        <div class="opponent">
            <span class="crown">👑</span>

            <div>
                <strong>MAGNUS AI</strong>
                <small>Rating 4000 • PERFECT</small>
            </div>
        </div>
    </header>


    <main class="game-container">

        <section class="board-section">

            <div class="status" id="status">
                YOUR MOVE
            </div>

            <div id="board"></div>

        </section>


        <aside class="game-panel">

            <div class="boss-card">

                <div class="boss-icon">👑</div>

                <h1>MAGNUS AI</h1>

                <div class="rating">4000</div>

                <div class="perfect">
                    ⚡ PERFECT
                </div>

                <p>
                    "The board belongs to me."
                </p>

            </div>


            <div class="moves">

                <h2>MOVE HISTORY</h2>

                <div id="moveHistory">
                    No moves yet.
                </div>

            </div>


            <button id="newGame">
                NEW GAME
            </button>

            <button id="resign">
                RESIGN
            </button>

        </aside>

    </main>


    <!-- Chess.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <!-- Magnus / Stockfish -->
    <script src="stockfish-18-lite-single.js"></script>

    <!-- Our game -->
    <script src="play.js"></script>

</body>
</html>
